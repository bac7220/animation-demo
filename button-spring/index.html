<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>button-spring</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <button class="spring-btn">跳ねる動き</button>
      <a href="#" class="spring-btn">詳しく見る</a>
    </div>
    <div class="wrapper">
      <button class="spring-text-btn">
        <span style="--i: 1">文</span>
        <span style="--i: 2">字</span>
        <span style="--i: 3">だ</span>
        <span style="--i: 4">け</span>
        <span style="--i: 5">動</span>
        <span style="--i: 6">く</span>
      </button>
    </div>
  </body>
</html>
