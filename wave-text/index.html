<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave text</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wave-text-wrapper">
      <svg viewBox="0 0 5000 200" preserveAspectRatio="xMinYMin slice" class="wave-svg">
        <path
          id="textWavePath"
          d="M0,100 Q250,50 500,100 T1000,100 T1500,100 T2000,100 T2500,100 T3000,100 T3500,100 T4000,100 T4500,100 T5000,100"
          fill="none"
        />

        <text class="moving-text" id="waveText">
          <textPath href="#textWavePath" startOffset="0"></textPath>
        </text>
      </svg>
    </div>
    <script src="script.js"></script>
  </body>
</html>
