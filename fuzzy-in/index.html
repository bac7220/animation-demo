<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuzzy Reveal Experience</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero-section">
      <div class="hero-content fuzzy-in">
        <h1>PURE MINIMALISM</h1>
        <p>スクロールに連動してボヤ〜っと現れる<br>アニメーションです</p>
      </div>
    </section>

    <section class="story-section black">
      <div class="container white fuzzy">
        <h2 class="reveal-on-scroll">THE MAGIC OF BLUR</h2>
        <p class="reveal-on-scroll">
          ただ表示されるのではなく、ピントが合うように現れることで、<br />
          デジタルな画面の中に「奥行き」と「余韻」が生まれます。
        </p>
      </div>
    </section>

    <section class="feature-grid">
      <div class="container fuzzy">
        <div class="feature-card reveal-on-scroll">
          <h3>Design</h3>
          <p>1秒のピント合わせが、視覚的な心地よさを提供します。</p>
        </div>
        <div class="feature-card reveal-on-scroll">
          <h3>Experience</h3>
          <p>ユーザーのスクロール速度に合わせた有機的な反応。</p>
        </div>
        <div class="feature-card reveal-on-scroll">
          <h3>Impact</h3>
          <p>キャッチコピーを一文字ずつ丁寧に読ませる力があります。</p>
        </div>
      </div>
    </section>

    <section class="closing-section black">
      <div class="container white fuzzy">
        <h2 >いつもご視聴頂きありがとうございます^^</h2>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
