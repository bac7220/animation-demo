<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smooth Wave Animation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="section-blue">
      <div class="wave-container">
        <div class="wave-inner wave-single"></div>
      </div>
      <h2>GENTLE WAVE</h2>
    </section>

    <section class="section-purple">
      <div class="wave-container">
        <div class="wave-inner wave-cross-back"></div>
        <div class="wave-inner wave-cross-front"></div>
      </div>
      <h2>CROSSING WAVES</h2>
    </section>

    <div class="spacer" style="height: 40vh"></div>
  </body>
</html>
