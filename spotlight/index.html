<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Spotlight Reveal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="section-title">
      <p style="color: #fff; margin-bottom: 10px">CORE FEATURES</p>
      <h1>Interactive Spotlight Grid</h1>
    </div>

    <div class="card-grid">
      <div class="spotlight-card">
        <div class="card-content">
          <span class="card-tag">Experience</span>
          <h3>Fluid Lighting</h3>
          <p>マウスの動きに追従する柔らかな光が、インターフェースに命を吹き込みます。</p>
        </div>
      </div>

      <div class="spotlight-card">
        <div class="card-content">
          <span class="card-tag">Precision</span>
          <h3>Border Glow</h3>
          <p>カードの境界線が光を反射し、物理的なプロダクトのような質感を与えます。</p>
        </div>
      </div>

      <div class="spotlight-card">
        <div class="card-content">
          <span class="card-tag">Design</span>
          <h3>Deep Contrast</h3>
          <p>暗闇と光のコントラストが、ユーザーの視線を自然に重要事項へと誘導します。</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
